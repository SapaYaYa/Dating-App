openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profile operations
  - name: reports
    description: User safety reports
  - name: safety
    description: Blocking and unmatching
  - name: likes
    description: Daily likes
  - name: ads
    description: >
      Rewarded ads. AdMob's signed "ad finished" message arrives at
      GET /api/ads/admob-callback (server-side verification); it is called by
      AdMob, not the app, so it isn't listed here.
  - name: discover
    description: Discover settings kept on the server
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      security:
        - bearerAuth: []
      summary: List profiles for discovery
      description: >
        Returns other users' profiles for the discovery feed. Each profile
        includes a server-computed, pre-rounded distanceKm based on the
        requesting user's stored location. Raw coordinates and birthdays are
        never returned for other users.
      responses:
        "200":
          description: Profiles returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      security:
        - bearerAuth: []
      summary: Get current user's profile
      description: Returns the profile for the authenticated user
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertMyProfile
      tags: [profiles]
      security:
        - bearerAuth: []
      summary: Create or update current user's profile
      description: Upserts the profile for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports:
    post:
      operationId: createReport
      tags: [reports]
      security:
        - bearerAuth: []
      summary: Submit a report
      description: >
        Stores a report for moderation with the authenticated user as the
        reporter, and blocks the reported profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid report input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blocks:
    post:
      operationId: blockProfile
      tags: [safety]
      security:
        - bearerAuth: []
      summary: Block a profile
      description: >
        Blocks a profile for the authenticated user. Blocked people are hidden
        from each other and their conversation ends. Blocking twice is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRef"
      responses:
        "204":
          description: Profile blocked
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /unmatches:
    post:
      operationId: unmatchProfile
      tags: [safety]
      security:
        - bearerAuth: []
      summary: Unmatch a profile
      description: >
        Ends the match between the authenticated user and a profile without
        blocking. Unmatching twice is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRef"
      responses:
        "204":
          description: Unmatched
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /likes/allowance:
    get:
      operationId: getLikeAllowance
      tags: [likes]
      security:
        - bearerAuth: []
      summary: Likes left today
      description: >
        Today's likes and rewarded-ad limits. "Today" is in the person's time
        zone; pass it to update it (daily likes and ad limits reset at
        midnight there).
      parameters:
        - name: timeZone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: IANA time zone, e.g. America/New_York.
      responses:
        "200":
          description: Today's likes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeAllowance"
        "400":
          description: Unknown time zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /likes/spend:
    post:
      operationId: spendLike
      tags: [likes]
      security:
        - bearerAuth: []
      summary: Use one of today's likes
      responses:
        "200":
          description: Like used; returns what's left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeAllowance"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Out of likes for today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ads/sessions:
    post:
      operationId: createAdSession
      tags: [ads]
      security:
        - bearerAuth: []
      summary: Start a rewarded ad
      description: >
        Call before playing a rewarded ad. Pass the returned id to AdMob as
        custom_data and the user's ID as user_id. The reward is granted when
        AdMob reports every ad in the session finished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdSessionInput"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSession"
        "400":
          description: Invalid input, or the reward isn't needed (free undo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Limit reached for today (or this week)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ads/sessions/{sessionId}:
    get:
      operationId: getAdSession
      tags: [ads]
      security:
        - bearerAuth: []
      summary: Check whether a rewarded ad's reward was granted
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ads/sessions/{sessionId}/test-complete:
    post:
      operationId: completeTestAd
      tags: [ads]
      security:
        - bearerAuth: []
      summary: Development only - count one fake ad as finished
      description: >
        Only works when the server runs with ADS_TEST_MODE=1 (never in
        production); otherwise 404. Stands in for AdMob's message while the
        app plays fake ads.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session after counting the ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found (or test mode is off)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /browse-city:
    get:
      operationId: getBrowseCity
      tags: [discover]
      security:
        - bearerAuth: []
      summary: The city being browsed in Discover
      responses:
        "200":
          description: Browse city and weekly limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseCity"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setBrowseCity
      tags: [discover]
      security:
        - bearerAuth: []
      summary: Browse another city, or go back to your own area
      description: >
        A different city is allowed once a week, or early with a granted,
        unused city-skip ad session. null (your own area) and the same city
        again are always allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowseCityInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseCity"
        "400":
          description: Invalid input or city-skip session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Weekly limit; try again at nextChangeAt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required: [id, name, lookingFor, bio, photos, interests, occupation]
      properties:
        id:
          type: string
        name:
          type: string
        age:
          type: ["integer", "null"]
        birthday:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        lookingFor:
          type: array
          minItems: 1
          items:
            type: string
            enum: [Men, Women, Non-binary, Trans Men, Trans Women, Everyone]
        bio:
          type: string
        photos:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        occupation:
          type: string
        distanceKm:
          type: ["integer", "null"]
          description: >
            Pre-rounded distance in whole kilometres between this profile and the
            requesting user. Null when viewing your own profile. Never includes
            raw coordinates.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        age:
          type: integer
          minimum: 18
          maximum: 120
          description: Users must be 18 or older.
        birthday:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Date of birth as YYYY-MM-DD.
        gender:
          type: string
          maxLength: 50
        lookingFor:
          type: array
          minItems: 1
          items:
            type: string
            enum: [Men, Women, Non-binary, Trans Men, Trans Women, Everyone]
        bio:
          type: string
          maxLength: 500
        photos:
          type: array
          minItems: 3
          maxItems: 8
          description: >
            At least 3 and at most 8 photos. Required when the profile is
            first created; optional on later updates (e.g. editing the bio).
          items:
            type: string
        interests:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        occupation:
          type: string
          maxLength: 100
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: >
            Viewer's current latitude. Stored server-side only for distance
            computation; never returned in any profile response.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: >
            Viewer's current longitude. Stored server-side only for distance
            computation; never returned in any profile response.
    ProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
    ReportInput:
      type: object
      required: [reportedProfileId, category]
      properties:
        reportedProfileId:
          type: string
          minLength: 1
          maxLength: 255
          description: ID of the profile being reported. You cannot report yourself.
        category:
          type: string
          enum:
            - Fake Profile
            - Harassment
            - Spam
            - Inappropriate Photos
            - Violence
            - Catfishing
            - Impersonation
        note:
          type: string
          maxLength: 500
          default: ""
          description: Optional details about the report
    Report:
      type: object
      required: [id, reportedProfileId, reporterId, category, note, timestamp]
      properties:
        id:
          type: integer
        reportedProfileId:
          type: string
        reporterId:
          type: string
        category:
          type: string
          enum:
            - Fake Profile
            - Harassment
            - Spam
            - Inappropriate Photos
            - Violence
            - Catfishing
            - Impersonation
        note:
          type: string
        timestamp:
          type: string
          format: date-time
    ProfileRef:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          minLength: 1
          maxLength: 255
          description: ID of the other profile. You cannot block or unmatch yourself.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    RewardPlacement:
      type: string
      enum: [extraLikes, undoPass, citySkip]
    AdsLeft:
      type: object
      required: [extraLikes, undoPass, citySkip]
      properties:
        extraLikes:
          type: integer
          description: Extra-likes ads left today (3 a day).
        undoPass:
          type: integer
          description: Undo ads left today (5 a day).
        citySkip:
          type: integer
          description: City-skip rewards left this week (1 a week).
    LikeAllowance:
      type: object
      required: [likesLeft, dailyLikes, extraLikes, used, level, freeUndo, adsLeft]
      properties:
        likesLeft:
          type: integer
        dailyLikes:
          type: integer
          description: Today's free likes (5, or 6 at level 5+).
        extraLikes:
          type: integer
          description: Likes earned today, e.g. from ads.
        used:
          type: integer
        level:
          type: integer
        freeUndo:
          type: boolean
          description: True from level 4; undo then needs no ad.
        adsLeft:
          $ref: "#/components/schemas/AdsLeft"
    AdSessionInput:
      type: object
      required: [placement]
      properties:
        placement:
          $ref: "#/components/schemas/RewardPlacement"
    AdSession:
      type: object
      required: [id, placement, adsRequired, adsCompleted, granted]
      properties:
        id:
          type: string
        placement:
          $ref: "#/components/schemas/RewardPlacement"
        adsRequired:
          type: integer
        adsCompleted:
          type: integer
        granted:
          type: boolean
    BrowseCity:
      type: object
      required: [city, lastCity, changedAt, nextChangeAt, citySkipsLeft]
      properties:
        city:
          type: [string, "null"]
          description: The city browsed now; null means your own area.
        lastCity:
          type: [string, "null"]
          description: The last city switched to; picking it again is always allowed.
        changedAt:
          type: [string, "null"]
          format: date-time
        nextChangeAt:
          type: [string, "null"]
          format: date-time
          description: When a different city is allowed again; null if now.
        citySkipsLeft:
          type: integer
    BrowseCityInput:
      type: object
      required: [city]
      properties:
        city:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        skipSessionId:
          type: string
          description: A granted, unused city-skip ad session, to change city before the week is up.
